<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GuessMaster — Random Number Game</title>
  <style>
    :root{
      --bg:#0f172a; --card:#0b1220; --accent:#7dd3fc; --muted:#94a3b8;
      --success:#34d399; --danger:#f87171; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    }
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:
      linear-gradient(180deg,#071029 0%, #061322 100%);color:#e6eef8}
    .card{width:clamp(300px, 520px, 760px);background:linear-gradient(180deg,var(--card),#071029);
      padding:28px;border-radius:14px;box-shadow:0 10px 30px rgba(2,6,23,.6);border:1px solid rgba(255,255,255,.03)}
    h1{margin:0;font-size:1.4rem;letter-spacing:0.2px}
    p.lead{margin:8px 0 18px;color:var(--muted)}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    input[type=number]{flex:1;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.06);
      background:transparent;color:inherit;font-size:1rem;outline:none}
    button{padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:#022;cursor:pointer;font-weight:600}
    .info{margin-top:14px;padding:12px;border-radius:8px;background:rgba(255,255,255,.02);color:var(--muted)}
    .log{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
    .chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.03);font-size:.9rem}
    .status{margin-top:14px;padding:12px;border-radius:8px;}
    .status.good{background:linear-gradient(90deg, rgba(52,211,153,.12), rgba(34,197,94,.06)); color:var(--success)}
    .status.bad{background:linear-gradient(90deg, rgba(248,113,113,.08), rgba(244,63,94,.04)); color:var(--danger)}
    footer{margin-top:16px;font-size:.82rem;color:var(--muted);text-align:center}
    .controls{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">GuessMaster — Pick the Number</h1>
    <p class="lead">I’ve chosen a number between <strong id="min">1</strong> and <strong id="max">100</strong>. Can you guess it?</p>

    <div class="row controls" role="group" aria-label="game controls">
      <input id="guessInput" type="number" min="1" max="100" placeholder="Enter your guess" />
      <button id="checkBtn">Check</button>
      <button id="newBtn" style="background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--accent)">New Game</button>
    </div>

    <div id="status" class="status info" style="display:none"></div>

    <div class="log" aria-live="polite" id="history"></div>

    <div class="info" id="meta">
      <div class="chip">Tries: <span id="tries">0</span></div>
      <div class="chip">Best: <span id="best">—</span></div>
      <div class="chip">Range: <span id="range">1–100</span></div>
    </div>

    <footer>Built for portfolio — small interactive app (JS + HTML) • Lightweight & responsive</footer>
  </main>

<script>
(() => {
  const MIN = 1, MAX = 100;
  let target = null, tries = 0, best = null;
  const guessInput = document.getElementById('guessInput');
  const checkBtn = document.getElementById('checkBtn');
  const newBtn = document.getElementById('newBtn');
  const historyEl = document.getElementById('history');
  const triesEl = document.getElementById('tries');
  const bestEl = document.getElementById('best');
  const statusEl = document.getElementById('status');
  const minEl = document.getElementById('min');
  const maxEl = document.getElementById('max');

  function rnd() { return Math.floor(Math.random() * (MAX - MIN + 1)) + MIN; }
  function startGame() {
    target = rnd(); tries = 0;
    triesEl.textContent = tries; statusEl.style.display='none'; historyEl.innerHTML='';
    minEl.textContent = MIN; maxEl.textContent = MAX;
    guessInput.value=''; guessInput.disabled=false; guessInput.focus();
  }

  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = 'status ' + (type === 'good' ? 'good' : 'bad');
    statusEl.style.display = 'block';
  }

  function recordGuess(g, hint){
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = `#${tries} — ${g} → ${hint}`;
    historyEl.prepend(chip);
  }

  checkBtn.addEventListener('click', () => {
    const val = Number(guessInput.value);
    if (!val || val < MIN || val > MAX) { setStatus('Please enter a valid number within range.', 'bad'); return; }

    tries += 1; triesEl.textContent = tries;
    if (val === target) {
      setStatus(`🎉 Correct! The number was ${target}. You guessed in ${tries} tries.`, 'good');
      recordGuess(val, 'Correct');
      if (!best || tries < best) { best = tries; bestEl.textContent = best; }
      guessInput.disabled = true;
    } else {
      const hint = val < target ? 'Too low' : 'Too high';
      setStatus(hint + (Math.abs(val-target) <= 3 ? ' — Very close!' : ''), 'bad');
      recordGuess(val, hint);
    }
  });

  newBtn.addEventListener('click', startGame);

  // keyboard support: Enter = check
  guessInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkBtn.click(); });

  // init
  startGame();
})();
</script>
</body>
</html>
